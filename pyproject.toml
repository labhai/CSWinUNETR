[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cswinunetr"
version = "0.1.0"
description = "CSWinUNETR: Segmentation of Thin Anatomical Structures in Medical Images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<2.6",
    "monai==1.3.2",
    "numpy==1.26.4",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
train = ["albumentations==1.3.1", "opencv-python-headless==4.10.0.84", "schedulefree==1.4.1"]
eval = ["scipy>=1.11,<2", "scikit-image>=0.22,<0.27"]

[tool.setuptools]
packages = [
    "cswinunetr",
    "cswinunetr.models",
    "cswinunetr.datasets",
    "cswinunetr.engine",
    "cswinunetr.utils",
]

[tool.setuptools.package-data]
"cswinunetr.datasets" = ["splits/ffhq/*.txt"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["cswinunetr"]
